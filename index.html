<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flipkart | Vishwash Store - Online Shopping App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f3f6; }
        .toast-slide { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .hover-glow:hover { transform: scale(1.05); filter: brightness(1.1); transition: all 0.2s ease; }
        /* App shell container for mobile-like wrapper on desktop */
        .app-shell { max-width: 480px; margin: 0 auto; background: #fff; min-height: 100vh; box-shadow: 0 0 25px rgba(0,0,0,0.1); }
        @media (min-width: 768px) {
            body { background: #e2e8f0; display: flex; justify-content: center; }
            .app-shell { max-width: 768px; }
        }
        @media (min-width: 1024px) {
            .app-shell { max-width: 1152px; }
        }
    </style>
</head>
<body class="antialiased min-h-screen text-slate-800">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-20 left-1/2 -translate-x-1/2 z-[120] flex flex-col gap-2 pointer-events-none w-11/max-w-sm"></div>

    <!-- Flipkart Style Sticky App Shell -->
    <div class="app-shell flex flex-col justify-between relative bg-slate-50 min-h-screen">
        
        <!-- Flipkart Header (Blue Theme with Mic, Camera & Centered Home / Search) -->
        <header class="sticky top-0 z-40 bg-[#2874f0] text-white shadow-md">
            <div class="px-3 py-2.5 flex items-center gap-2">
                <!-- Brand / Logo -->
                <a href="#" onclick="switchTab('shop')" class="flex flex-col leading-none shrink-0 group hover:opacity-90">
                    <span class="text-sm italic font-extrabold tracking-tighter text-yellow-300">Explore <span class="text-white">Plus</span></span>
                    <span class="text-base font-extrabold tracking-tight flex items-center">Vishwash<i class="fa-solid fa-bolt text-[10px] text-yellow-300 ml-0.5"></i></span>
                </a>

                <!-- Centered Search Bar with Mic & Camera -->
                <div class="flex-1 relative bg-white rounded-sm flex items-center px-2 py-1.5 shadow-inner">
                    <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs mr-2"></i>
                    <input type="text" id="search-input" placeholder="Search for Products, Brands..." 
                        class="w-full text-xs text-slate-800 focus:outline-none bg-transparent">
                    <div class="flex items-center gap-2.5 ml-1 text-slate-500">
                        <!-- Camera Search Trigger -->
                        <label title="Camera se photo khichein" class="cursor-pointer hover:text-blue-600 transition hover-glow">
                            <i class="fa-solid fa-camera text-sm"></i>
                            <input type="file" id="camera-file-input" accept="image/*" capture="environment" class="hidden" onchange="handleCameraSearch(event)">
                        </label>
                        <!-- Mic Voice Search Trigger -->
                        <button onclick="startVoiceSearch()" title="Bolkar search karein" class="hover:text-blue-600 transition hover-glow">
                            <i class="fa-solid fa-microphone text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Seller Hub Shortcut -->
                <button onclick="openSellerModal()" class="text-[11px] font-bold bg-white/20 hover:bg-white/30 px-2 py-1.5 rounded transition shrink-0 hover-glow">
                    Seller
                </button>
            </div>

            <!-- Category Pills / Horizontal Scroll -->
            <div class="bg-white text-slate-800 border-t border-slate-200 overflow-x-auto no-scrollbar flex items-center px-2 py-2 gap-4 text-[11px] font-semibold">
                <button onclick="filterCategory('All')" id="cat-btn-All" class="whitespace-nowrap px-2 py-1 rounded bg-blue-50 text-blue-600 font-bold transition">All</button>
                <button onclick="filterCategory('Audio')" id="cat-btn-Audio" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Audio</button>
                <button onclick="filterCategory('Wearables')" id="cat-btn-Wearables" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Wearables</button>
                <button onclick="filterCategory('Accessories')" id="cat-btn-Accessories" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Accessories</button>
                <button onclick="filterCategory('Power')" id="cat-btn-Power" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Power</button>
                <button onclick="filterCategory('Gaming')" id="cat-btn-Gaming" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Gaming</button>
                <button onclick="filterCategory('Home')" id="cat-btn-Home" class="whitespace-nowrap px-2 py-1 rounded hover:bg-slate-100 transition">Home</button>
            </div>
        </header>

        <!-- Main Viewport Area -->
        <main class="flex-1 pb-24">
            
            <!-- SHOP VIEW -->
            <section id="view-shop">
                <!-- Flipkart Banner / Flash Deal Header -->
                <div class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white p-3 flex items-center justify-between text-xs font-bold">
                    <span class="flex items-center gap-1.5"><i class="fa-solid fa-bolt text-yellow-300"></i> Deals of the Day (25 Items)</span>
                    <span class="bg-white/20 px-2 py-0.5 rounded text-[10px]">10% Flat OFF</span>
                </div>

                <!-- 3 Products per Row on Mobile, 4-5 on Desktop -->
                <div id="product-grid" class="grid grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-1.5 p-1.5"></div>
            </section>

            <!-- WISHLIST VIEW -->
            <section id="view-wishlist" class="hidden p-3">
                <div class="flex items-center justify-between mb-4 border-b pb-2">
                    <h2 class="font-bold text-base text-slate-800">My Wishlist</h2>
                    <button onclick="switchTab('shop')" class="text-xs bg-slate-200 px-3 py-1 rounded font-bold hover-glow">Back</button>
                </div>
                <div id="wishlist-grid" class="grid grid-cols-2 md:grid-cols-4 gap-2"></div>
            </section>

            <!-- ORDERS VIEW -->
            <section id="view-orders" class="hidden p-3">
                <div class="flex items-center justify-between mb-4 border-b pb-2">
                    <h2 class="font-bold text-base text-slate-800">My Orders</h2>
                    <button onclick="switchTab('shop')" class="text-xs bg-slate-200 px-3 py-1 rounded font-bold hover-glow">Back</button>
                </div>
                <div id="orders-list" class="space-y-3"></div>
            </section>
        </main>

        <!-- Bottom Flipkart Navigation Bar (Center Home) -->
        <nav class="sticky bottom-0 z-40 bg-white border-t border-slate-200 grid grid-cols-5 text-center py-1.5 text-[10px] font-bold text-slate-600 shadow-lg">
            <button onclick="switchTab('wishlist')" id="nav-wishlist" class="flex flex-col items-center justify-center hover:text-blue-600 transition hover-glow">
                <i class="fa-solid fa-heart text-base text-slate-400"></i>
                <span>Wishlist</span>
            </button>
            <button onclick="toggleCart()" class="flex flex-col items-center justify-center relative hover:text-blue-600 transition hover-glow">
                <i class="fa-solid fa-cart-shopping text-base text-slate-400"></i>
                <span>Cart</span>
                <span id="nav-cart-badge" class="absolute top-0 right-5 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
            </button>
            <!-- Center Home Button -->
            <button onclick="switchTab('shop')" id="nav-home" class="flex flex-col items-center justify-center text-blue-600 transition hover-glow">
                <div class="bg-blue-600 text-white w-9 h-9 rounded-full flex items-center justify-center -mt-3 shadow-md border-2 border-white">
                    <i class="fa-solid fa-house text-sm"></i>
                </div>
                <span class="mt-0.5">Home</span>
            </button>
            <button onclick="switchTab('orders')" id="nav-orders" class="flex flex-col items-center justify-center hover:text-blue-600 transition hover-glow">
                <i class="fa-solid fa-box text-base text-slate-400"></i>
                <span>Orders</span>
            </button>
            <button onclick="openSellerModal()" class="flex flex-col items-center justify-center hover:text-blue-600 transition hover-glow">
                <i class="fa-solid fa-store text-base text-slate-400"></i>
                <span>Seller</span>
            </button>
        </nav>
    </div>

    <!-- PRODUCT DETAIL & CUSTOMER REVIEW MODAL -->
    <div id="product-detail-modal" class="fixed inset-0 z-50 invisible flex items-center justify-center p-2 sm:p-4">
        <div id="pd-backdrop" onclick="closeProductDetail()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs opacity-0 transition-opacity"></div>
        <div id="pd-panel" class="relative bg-white w-full max-w-lg rounded-2xl shadow-2xl p-4 sm:p-6 transform scale-95 opacity-0 transition-all z-10 max-h-[92vh] overflow-y-auto">
            <button onclick="closeProductDetail()" class="absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 hover-glow">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="pd-content"></div>
        </div>
    </div>

    <!-- SELLER HUB MODAL -->
    <div id="seller-modal" class="fixed inset-0 z-50 invisible flex items-center justify-center p-4">
        <div onclick="closeSellerModal()" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs"></div>
        <div class="relative bg-white w-full max-w-md rounded-2xl shadow-2xl p-5 z-10 max-h-[90vh] overflow-y-auto space-y-3">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900"><i class="fa-solid fa-store text-blue-600 mr-1"></i> Seller Account / Add Item</h3>
                <button onclick="closeSellerModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleSellerAddProduct(event)" class="space-y-3 text-xs">
                <input type="text" id="s-name" placeholder="Seller / Store Name" required class="w-full border p-2 rounded">
                <input type="text" id="p-title" placeholder="Product Title" required class="w-full border p-2 rounded">
                <select id="p-cat" class="w-full border p-2 rounded">
                    <option value="Audio">Audio</option>
                    <option value="Wearables">Wearables</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Power">Power</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Home">Home</option>
                </select>
                <input type="number" id="p-price" placeholder="Original Price (₹)" required class="w-full border p-2 rounded">
                <input type="url" id="p-image" placeholder="Image URL (Unsplash/Direct link)" required class="w-full border p-2 rounded">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded hover-glow">Add Product (10% OFF Auto)</button>
            </form>
        </div>
    </div>

    <!-- CAMERA MATCH RESULT POPUP / MODAL -->
    <div id="camera-match-modal" class="fixed inset-0 z-50 invisible flex items-center justify-center p-4 bg-slate-900/70">
        <div class="bg-white w-full max-w-sm rounded-2xl p-4 text-center space-y-3 shadow-2xl">
            <h3 class="font-bold text-sm text-slate-900">📷 Camera Image Recognized</h3>
            <div id="camera-match-result" class="border rounded-xl p-3 bg-slate-50 text-xs"></div>
            <button onclick="document.getElementById('camera-match-modal').classList.add('invisible')" class="w-full bg-slate-200 py-2 rounded font-bold text-xs">Close</button>
        </div>
    </div>

    <!-- CART SIDE DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 z-50 invisible transition-all">
        <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-slate-900/60 opacity-0 transition-opacity"></div>
        <div id="cart-panel" class="fixed inset-y-0 right-0 max-w-full flex pl-10 transform translate-x-full transition-transform">
            <div class="w-screen max-w-sm bg-white shadow-2xl flex flex-col">
                <div class="px-4 py-3 border-b flex justify-between items-center font-bold text-sm">
                    <span>Shopping Cart</span>
                    <button onclick="toggleCart()" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3 divide-y divide-slate-100 text-xs"></div>
                <div class="border-t p-4 bg-slate-50 space-y-3">
                    <div class="flex justify-between font-extrabold text-sm">
                        <span>Total (10% OFF)</span>
                        <span id="cart-total">₹0</span>
                    </div>
                    <!-- Flipkart Red Buy Button -->
                    <button onclick="checkoutWhatsApp()" class="w-full bg-[#fb641b] hover:bg-[#e05510] text-white font-bold py-3 rounded text-xs uppercase tracking-wider shadow hover-glow">
                        Red Buy Now / Place Order
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FULL LOGIC SCRIPT (25 Products, Camera Match, Reviews, Red Buy Button) -->
    <script>
        const ADMIN_PHONE = '918460183525';
        const poolPhotos = [
            '1523275335684-37898b6baf30', '1505740420928-5e560c06d30e', '1546868871-7041f2a55e12',
            '1583394838336-acd977736f90', '1572569511254-d8f925fe2cbb', '1511707171634-5f897ff02aa9',
            '1526170375885-4d8ecf77b99f', '1542291026-7eec264c27ff', '1359586543673-9ec078b30d31',
            '1550745165-9bc0b252726f', '1507679799987-c73779587ccf', '1591047139829-d91aecb6caea',
            '1522335789203-aabd1fc54bc9', '1533575747076-0db72165de50', '1503602642458-232111445657'
        ];

        const rawTemplates = [
            { name: 'Pro Wireless Earbuds', category: 'Audio', price: 999 },
            { name: 'AMOLED Smart Watch', category: 'Wearables', price: 1999 },
            { name: 'Genuine Leather Wallet', category: 'Accessories', price: 499 },
            { name: 'Fast Power Bank 10000mAh', category: 'Power', price: 1299 },
            { name: 'Polarized UV Sunglasses', category: 'Accessories', price: 699 },
            { name: 'RGB Gaming Mouse', category: 'Gaming', price: 899 },
            { name: 'Neckband Bass Edition', category: 'Audio', price: 799 },
            { name: 'Type-C Braided Cable 2M', category: 'Accessories', price: 299 },
            { name: 'Portable Bluetooth Speaker', category: 'Audio', price: 1499 },
            { name: 'Mechanical RGB Keyboard', category: 'Gaming', price: 2499 },
            { name: 'Wireless Charging Pad 15W', category: 'Power', price: 999 },
            { name: 'Smart Digital Weight Scale', category: 'Home', price: 1199 },
            { name: 'USB-C Multiport 6-in-1 Hub', category: 'Accessories', price: 1599 },
            { name: 'LED Touch Desk Lamp', category: 'Home', price: 899 },
            { name: 'Anti-Theft Travel Backpack', category: 'Accessories', price: 1899 },
            { name: 'Mini Portable Travel Iron', category: 'Home', price: 1299 },
            { name: 'Insulated Stainless Steel Flask', category: 'Home', price: 699 },
            { name: 'Car Dashboard Mobile Holder', category: 'Accessories', price: 399 },
            { name: 'Ring Light with Tripod', category: 'Home', price: 1399 },
            { name: 'Electric Precision Hair Trimmer', category: 'Wearables', price: 999 },
            { name: 'Active Noise Canceling Pods', category: 'Audio', price: 2199 },
            { name: 'Fitness Smart Ring', category: 'Wearables', price: 2999 },
            { name: 'GaN Ultra Fast Charger 65W', category: 'Power', price: 1799 },
            { name: 'Gaming Headset 7.1 Surround', category: 'Gaming', price: 1699 },
            { name: 'Smart Wi-Fi Bulb Duo', category: 'Home', price: 799 }
        ];

        // Exact pool image mapped to primary and gallery list containing the exact product image + 2 related angles
        let products = rawTemplates.map((item, idx) => {
            const sig = poolPhotos[idx % poolPhotos.length];
            const sec = poolPhotos[(idx + 4) % poolPhotos.length];
            const primaryImg = `https://images.unsplash.com/photo-${sig}?w=400&auto=format&fit=crop&q=80`;
            return {
                id: idx + 1,
                name: `${item.name}`,
                category: item.category,
                originalPrice: item.price,
                price: Math.round(item.price * 0.9),
                image: primaryImg,
                gallery: [
                    primaryImg,
                    `https://images.unsplash.com/photo-${sig}?w=500&auto=format&fit=crop&q=80`,
                    `https://images.unsplash.com/photo-${sec}?w=500&auto=format&fit=crop&q=80`
                ],
                reviews: [
                    { user: 'Rahul K.', rating: 5, comment: 'Ekdum mast product, Flipkart jaisi fast delivery mili!' },
                    { user: 'Pooja M.', rating: 4, comment: 'Quality achhi hai, price ke hisab se best.' }
                ]
            };
        });

        let cart = [];
        let wishlist = [];
        let orders = JSON.parse(localStorage.getItem('fk_vishwash_orders')) || [];
        let searchQuery = '';
        let activeCategory = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            setupSearch();
        });

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = 'toast-slide bg-slate-900 text-white text-xs px-3 py-2 rounded shadow-lg text-center font-bold';
            el.innerText = msg;
            container.appendChild(el);
            setTimeout(() => el.remove(), 2500);
        }

        function switchTab(tab) {
            ['shop', 'wishlist', 'orders'].forEach(t => document.getElementById(`view-${t}`).classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            if(tab === 'wishlist') renderWishlist();
            if(tab === 'orders') renderOrders();
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function setupSearch() {
            document.getElementById('search-input').addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase().trim();
                renderProducts();
            });
        }

        function filterCategory(cat) {
            activeCategory = cat;
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const filtered = products.filter(p => {
                const matchCat = activeCategory === 'All' || p.category === activeCategory;
                const matchQuery = p.name.toLowerCase().includes(searchQuery);
                return matchCat && matchQuery;
            });

            grid.innerHTML = filtered.map(p => {
                const isWished = wishlist.includes(p.id);
                return `
                    <div class="bg-white rounded border border-slate-200 p-2 flex flex-col justify-between relative shadow-xs hover:shadow-md transition">
                        <!-- Single Wishlist Icon Top Right -->
                        <button onclick="event.stopPropagation(); toggleWishlist(${p.id})" class="absolute top-2 right-2 z-10 text-slate-400 hover:text-red-500 transition hover-glow">
                            <i class="fa-${isWished ? 'solid text-red-500' : 'regular'} fa-heart text-sm"></i>
                        </button>
                        <div onclick="openProductDetail(${p.id})" class="cursor-pointer">
                            <img src="${p.image}" class="w-full aspect-square object-cover rounded mb-1.5">
                            <span class="text-[9px] text-blue-600 font-bold uppercase">${p.category}</span>
                            <h3 class="text-[11px] font-semibold text-slate-800 line-clamp-1">${p.name}</h3>
                            <div class="flex items-center gap-1 mt-1">
                                <span class="text-xs font-extrabold text-slate-900">₹${p.price}</span>
                                <span class="text-[10px] text-slate-400 line-through">₹${p.originalPrice}</span>
                                <span class="text-[9px] text-green-700 font-bold">10%off</span>
                            </div>
                        </div>
                        <div class="mt-2 grid grid-cols-2 gap-1">
                            <button onclick="addToCart(${p.id})" class="bg-yellow-400 hover:bg-yellow-500 text-slate-900 font-bold py-1.5 rounded text-[10px] hover-glow">Cart</button>
                            <button onclick="buyNowDirect(${p.id})" class="bg-[#fb641b] hover:bg-[#e05510] text-white font-bold py-1.5 rounded text-[10px] hover-glow">RED BUY</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleWishlist(id) {
            const idx = wishlist.indexOf(id);
            if(idx > -1) { wishlist.splice(idx, 1); showToast('Removed from wishlist'); }
            else { wishlist.push(id); showToast('Added to wishlist'); }
            renderProducts();
        }

        function renderWishlist() {
            const grid = document.getElementById('wishlist-grid');
            const items = products.filter(p => wishlist.includes(p.id));
            if(items.length === 0) { grid.innerHTML = `<p class="col-span-full text-center text-xs text-slate-400">Wishlist empty</p>`; return; }
            grid.innerHTML = items.map(p => `
                <div class="bg-white border rounded p-2 text-xs">
                    <img src="${p.image}" class="w-full aspect-square object-cover rounded mb-1">
                    <div class="font-bold line-clamp-1">${p.name}</div>
                    <div class="font-extrabold text-blue-600">₹${p.price}</div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-blue-600 text-white py-1 rounded mt-2 font-bold hover-glow">Move to Cart</button>
                </div>
            `).join('');
        }

        function openProductDetail(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            const container = document.getElementById('pd-content');
            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <!-- Gallery using exact matching product source images -->
                        <img id="main-prod-img" src="${p.gallery[0]}" class="w-full aspect-square object-cover rounded-xl mb-2">
                        <div class="flex gap-1.5">
                            ${p.gallery.map(img => `<img src="${img}" onclick="document.getElementById('main-prod-img').src='${img}'" class="w-12 h-12 object-cover rounded border cursor-pointer hover-glow">`).join('')}
                        </div>
                    </div>
                    <div class="space-y-3">
                        <h2 class="font-bold text-sm sm:text-base">${p.name}</h2>
                        <div class="flex items-center gap-2">
                            <span class="text-lg font-extrabold text-slate-900">₹${p.price}</span>
                            <span class="text-xs text-slate-400 line-through">₹${p.originalPrice}</span>
                            <span class="bg-green-100 text-green-700 text-[10px] font-bold px-1.5 py-0.5 rounded">10% OFF</span>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border space-y-2">
                            <h4 class="font-bold text-xs text-slate-700">Customer Reviews ⭐ 4.5/5</h4>
                            <div class="space-y-1.5 max-h-32 overflow-y-auto">
                                ${p.reviews.map(r => `<div class="text-[11px] bg-white p-1.5 rounded border"><b class="text-slate-900">${r.user}:</b>${r.comment}</div>`).join('')}
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 pt-2">
                            <button onclick="addToCart(${p.id}); closeProductDetail();" class="bg-yellow-400 text-slate-900 font-bold py-2.5 rounded text-xs hover-glow">Add to Cart</button>
                            <button onclick="buyNowDirect(${p.id}); closeProductDetail();" class="bg-[#fb641b] text-white font-bold py-2.5 rounded text-xs hover-glow">RED BUY NOW</button>
                        </div>
                    </div>
                </div>
            `;
            const modal = document.getElementById('product-detail-modal');
            const panel = document.getElementById('pd-panel');
            const backdrop = document.getElementById('pd-backdrop');
            modal.classList.remove('invisible');
            setTimeout(() => { backdrop.style.opacity = '1'; panel.style.transform = 'scale(1)'; panel.style.opacity = '1'; }, 10);
        }

        function closeProductDetail() {
            document.getElementById('product-detail-modal').classList.add('invisible');
        }

        function addToCart(id) {
            const p = products.find(x => x.id === id);
            const found = cart.find(x => x.id === id);
            if(found) found.qty += 1;
            else cart.push({...p, qty: 1});
            updateCartUI();
            showToast('Added to cart');
        }

        function updateCartUI() {
            const totalCount = cart.reduce((a,b)=>a+b.qty,0);
            document.getElementById('nav-cart-badge').innerText = totalCount;
            const container = document.getElementById('cart-items');
            if(cart.length === 0) { container.innerHTML = `<p class="text-center text-slate-400 py-6">Cart empty</p>`; document.getElementById('cart-total').innerText = '₹0'; return; }
            let total = 0;
            container.innerHTML = cart.map(i => {
                total += i.price * i.qty;
                return `<div class="flex justify-between items-center py-2">
                    <div><b>${i.name}</b> (x${i.qty})</div>
                    <div class="font-extrabold text-blue-600">₹${i.price * i.qty}</div>
                </div>`;
            }).join('');
            document.getElementById('cart-total').innerText = `₹${total}`;
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const panel = document.getElementById('cart-panel');
            const backdrop = document.getElementById('cart-backdrop');
            if(drawer.classList.contains('invisible')) {
                drawer.classList.remove('invisible');
                setTimeout(() => { backdrop.style.opacity = '1'; panel.classList.remove('translate-x-full'); }, 10);
            } else {
                backdrop.style.opacity = '0'; panel.classList.add('translate-x-full');
                setTimeout(() => drawer.classList.add('invisible'), 300);
            }
        }

        function buyNowDirect(id) {
            const p = products.find(x => x.id === id);
            const order = { id: 'FK-'+Math.floor(100000+Math.random()*900000), date: new Date().toLocaleDateString(), items: [p], total: p.price };
            orders.unshift(order);
            localStorage.setItem('fk_vishwash_orders', JSON.stringify(orders));
            const msg = `*Flipkart Instant Order*\nOrder ID: ${order.id}\nItem: ${p.name}\nTotal: ₹${p.price} (COD)`;
            window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            showToast('Order Redirected via Red Buy!');
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) { showToast('Cart is empty'); return; }
            const total = cart.reduce((a,b)=>a+(b.price*b.qty),0);
            const order = { id: 'FK-'+Math.floor(100000+Math.random()*900000), date: new Date().toLocaleDateString(), items: [...cart], total };
            orders.unshift(order);
            localStorage.setItem('fk_vishwash_orders', JSON.stringify(orders));
            let msg = `*Flipkart Cart Order*\nOrder ID: ${order.id}\n`;
            cart.forEach(i => msg += `- ${i.name} x${i.qty} = ₹${i.price*i.qty}\n`);
            msg += `\nTotal: ₹${total}`;
            cart = []; updateCartUI(); toggleCart();
            window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderOrders() {
            const list = document.getElementById('orders-list');
            if(orders.length === 0) { list.innerHTML = `<p class="text-center text-xs text-slate-400">No orders yet</p>`; return; }
            list.innerHTML = orders.map(o => `
                <div class="bg-white border rounded p-3 text-xs shadow-xs space-y-1">
                    <div class="flex justify-between font-bold text-slate-900"><span>${o.id}</span><span>₹${o.total}</span></div>
                    <div class="text-[10px] text-slate-500">${o.date} | ${o.items.length} items</div>
                </div>
            `).join('');
        }

        // Camera Photo Feature Simulation / Recognition
        function handleCameraSearch(e) {
            const file = e.target.files[0];
            if(!file) return;
            // Match simulation with first matching item or random catalog item
            const matched = products[Math.floor(Math.random() * products.length)];
            const resBox = document.getElementById('camera-match-result');
            resBox.innerHTML = `
                <img src="${matched.image}" class="w-20 h-20 object-cover mx-auto rounded mb-2">
                <div class="font-bold">${matched.name}</div>
                <div class="font-extrabold text-blue-600 mb-2">₹${matched.price}</div>
                <button onclick="buyNowDirect(${matched.id}); document.getElementById('camera-match-modal').classList.add('invisible');" class="bg-[#fb641b] text-white px-4 py-1.5 rounded font-bold hover-glow">Red Buy Recognized Item</button>
            `;
            document.getElementById('camera-match-modal').classList.remove('invisible');
            showToast('Photo scanned & matched!');
        }

        function startVoiceSearch() {
            if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const rec = new SpeechRecognition();
                rec.lang = 'hi-IN';
                rec.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('search-input').value = transcript;
                    searchQuery = transcript.toLowerCase();
                    renderProducts();
                    showToast(`Voice Search: ${transcript}`);
                };
                rec.start();
            } else {
                showToast('Voice Search text input active');
            }
        }

        function openSellerModal() { document.getElementById('seller-modal').classList.remove('invisible'); }
        function closeSellerModal() { document.getElementById('seller-modal').classList.add('invisible'); }

        function handleSellerAddProduct(e) {
            e.preventDefault();
            const title = document.getElementById('p-title').value;
            const cat = document.getElementById('p-cat').value;
            const orig = Number(document.getElementById('p-price').value);
            const img = document.getElementById('p-image').value;
            const disc = Math.round(orig * 0.9);
            products.unshift({
                id: products.length + 1,
                name: title,
                category: cat,
                originalPrice: orig,
                price: disc,
                image: img,
                gallery: [img, img, img],
                reviews: [{user:'Seller Verified', rating:5, comment:'Brand new listed item'}]
            });
            closeSellerModal();
            renderProducts();
            showToast('Product added live with 10% OFF!');
        }
    </script>
</body>
</html>
