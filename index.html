    <style>

        /* =================================================
           RESET
        ================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            font-family: "Poppins", sans-serif;
            background: #fffdf8;
            color: #222;
            overflow-x: hidden;
        }


        body.no-scroll {
            overflow: hidden;
        }


        img {
            max-width: 100%;
            display: block;
        }


        a {
            text-decoration: none;
            color: inherit;
        }


        button,
        input,
        textarea,
        select {
            font-family: inherit;
        }


        button {
            cursor: pointer;
        }


        .container {
            width: 92%;
            max-width: 1250px;
            margin: auto;
        }


        /* =================================================
           PAGE LOADER
        ================================================= */

        #pageLoader {

            position: fixed;

            inset: 0;

            background: #b40000;

            z-index: 99999;

            display: flex;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            color: white;

            transition:
                opacity .6s ease,
                visibility .6s ease;

        }


        #pageLoader.hide {

            opacity: 0;

            visibility: hidden;

        }


        .loader-logo {

            font-size: 34px;

            font-weight: 800;

            letter-spacing: 2px;

            animation:
                loaderPulse 1.2s infinite;

        }


        .loader-logo span {

            color: #ffd000;

        }


        .loader-line {

            width: 160px;

            height: 4px;

            background: rgba(255,255,255,.3);

            margin-top: 20px;

            overflow: hidden;

            border-radius: 20px;

        }


        .loader-line::after {

            content: "";

            display: block;

            width: 50%;

            height: 100%;

            background: #ffd000;

            animation:
                loaderMove 1s infinite;

        }


        @keyframes loaderPulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.06);
            }

        }


        @keyframes loaderMove {

            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(300%);
            }

        }


        /* =================================================
           TOP BAR
        ================================================= */

        .top-bar {

            background: #a90000;

            color: white;

            padding: 8px 0;

            font-size: 12px;

        }


        .top-bar-inner {

            display: flex;

            justify-content: space-between;

            align-items: center;

        }


        .top-bar-left {

            display: flex;

            align-items: center;

            gap: 8px;

        }


        .top-bar-right {

            display: flex;

            gap: 18px;

        }


        .top-bar a {

            font-weight: 700;

        }


        /* =================================================
           HEADER
        ================================================= */

        header {

            position: sticky;

            top: 0;

            z-index: 5000;

            background: rgba(255,255,255,.96);

            backdrop-filter: blur(12px);

            box-shadow:
                0 4px 25px rgba(0,0,0,.07);

        }


        .navbar {

            min-height: 78px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 25px;

        }


        .logo {

            font-size: 25px;

            font-weight: 800;

            color: #b40000;

            letter-spacing: .5px;

            white-space: nowrap;

        }


        .logo span {

            color: #e7a900;

        }


        .nav-links {

            display: flex;

            align-items: center;

            gap: 28px;

            list-style: none;

        }


        .nav-links a {

            font-size: 14px;

            font-weight: 600;

            position: relative;

            padding: 8px 0;

        }


        .nav-links a::after {

            content: "";

            position: absolute;

            left: 0;

            bottom: 0;

            width: 0;

            height: 2px;

            background: #b40000;

            transition: .3s;

        }


        .nav-links a:hover {

            color: #b40000;

        }


        .nav-links a:hover::after {

            width: 100%;

        }


        /* =================================================
           HEADER ACTIONS
        ================================================= */

        .nav-actions {

            display: flex;

            align-items: center;

            gap: 9px;

        }


        .nav-icon {

            width: 43px;

            height: 43px;

            border: 1px solid #eee;

            border-radius: 50%;

            background: white;

            color: #333;

            position: relative;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: .3s;

        }


        .nav-icon:hover {

            background: #b40000;

            color: white;

            transform:
                translateY(-3px);

            box-shadow:
                0 8px 20px rgba(180,0,0,.2);

        }


        .count {

            position: absolute;

            right: -3px;

            top: -3px;

            width: 19px;

            height: 19px;

            background: #f3b000;

            color: #111;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 10px;

            font-weight: 800;

        }


        .count.bump {

            animation:
                countBump .4s ease;

        }


        @keyframes countBump {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.45);
            }

            100% {
                transform: scale(1);
            }

        }


        .menu-btn {

            display: none;

        }


        /* =================================================
           HERO
        ================================================= */

        .hero {

            min-height: 650px;

            position: relative;

            overflow: hidden;

            display: flex;

            align-items: center;

            background:

                radial-gradient(
                    circle at 80% 25%,
                    #ffe99d 0%,
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #fff8e5,
                    #fffdf9
                );

        }


        .hero::before {

            content: "";

            position: absolute;

            width: 500px;

            height: 500px;

            border-radius: 50%;

            background: rgba(255,210,0,.12);

            right: -150px;

            top: 100px;

            animation:
                heroFloat 6s ease-in-out infinite;

        }


        .hero::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            border: 25px solid rgba(180,0,0,.05);

            right: 32%;

            top: 80px;

            animation:
                rotateCircle 15s linear infinite;

        }


        @keyframes heroFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    scale(1);
            }

            50% {
                transform:
                    translateY(-25px)
                    scale(1.05);
            }

        }


        @keyframes rotateCircle {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }


        .hero-content {

            position: relative;

            z-index: 2;

            width: 58%;

        }


        .hero-tag {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 9px 15px;

            border-radius: 30px;

            background: #fff0bd;

            color: #a50000;

            font-size: 12px;

            font-weight: 800;

            animation:
                fadeDown .8s ease both;

        }


        .hero h1 {

            font-size:
                clamp(42px,6vw,76px);

            line-height: 1.02;

            color: #a90000;

            margin: 22px 0;

            font-weight: 800;

            animation:
                fadeUp .9s .15s ease both;

        }


        .hero h1 span {

            color: #e5a300;

        }


        .hero p {

            max-width: 620px;

            font-size: 16px;

            line-height: 1.8;

            color: #666;

            margin-bottom: 30px;

            animation:
                fadeUp .9s .3s ease both;

        }


        .hero-buttons {

            display: flex;

            gap: 12px;

            flex-wrap: wrap;

            animation:
                fadeUp .9s .45s ease both;

        }


        @keyframes fadeUp {

            from {

                opacity: 0;

                transform:
                    translateY(30px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        @keyframes fadeDown {

            from {

                opacity: 0;

                transform:
                    translateY(-20px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }


        /* =================================================
           BUTTONS
        ================================================= */

        .btn {

            border: none;

            border-radius: 9px;

            padding: 14px 23px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            font-weight: 700;

            transition: .3s;

        }


        .btn-primary {

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #b40000,
                    #d30000
                );

            box-shadow:
                0 10px 25px rgba(180,0,0,.18);

        }


        .btn-primary:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 15px 30px rgba(180,0,0,.28);

        }


        .btn-secondary {

            color: #b40000;

            background: white;

            border: 1px solid #ddd;

        }


        .btn-secondary:hover {

            border-color: #b40000;

            transform:
                translateY(-3px);

        }


        /* =================================================
           FLOATING HERO DECORATIONS
        ================================================= */

        .floating-circle {

            position: absolute;

            border-radius: 50%;

            z-index: 1;

            animation:
                floating 5s ease-in-out infinite;

        }


        .circle-one {

            width: 30px;

            height: 30px;

            background: #f5bd00;

            right: 18%;

            top: 20%;

        }


        .circle-two {

            width: 18px;

            height: 18px;

            background: #b40000;

            right: 10%;

            top: 62%;

            animation-delay: 1s;

        }


        .circle-three {

            width: 25px;

            height: 25px;

            background: #f5bd00;

            right: 42%;

            bottom: 15%;

            animation-delay: 2s;

        }


        @keyframes floating {

            0%,
            100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-20px);
            }

        }


        /* =================================================
           FEATURES
        ================================================= */

        .features {

            background: white;

            padding: 25px 0;

            box-shadow:
                0 4px 25px rgba(0,0,0,.04);

            position: relative;

            z-index: 5;

        }


        .feature-grid {

            display: grid;

            grid-template-columns:
                repeat(4,1fr);

            gap: 20px;

        }


        .feature {

            display: flex;

            align-items: center;

            gap: 12px;

        }


        .feature-icon {

            flex-shrink: 0;

            width: 48px;

            height: 48px;

            border-radius: 50%;

            background: #fff1bf;

            color: #b40000;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: .3s;

        }


        .feature:hover .feature-icon {

            transform:
                rotate(10deg)
                scale(1.08);

        }


        .feature h4 {

            font-size: 13px;

            margin-bottom: 2px;

        }


        .feature p {

            color: #888;

            font-size: 10px;

        }


        /* =================================================
           SECTION BASE
        ================================================= */

        section {

            padding: 85px 0;

        }


        .section-title {

            text-align: center;

            margin-bottom: 45px;

        }


        .section-title small {

            color: #b40000;

            font-weight: 800;

            letter-spacing: 2px;

            font-size: 11px;

        }


        .section-title h2 {

            font-size: 38px;

            margin:
                8px 0 10px;

        }


        .section-title p {

            color: #888;

            font-size: 14px;

        }


        /* =================================================
           SEARCH AREA
        ================================================= */

        .shop-toolbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;

        }


        .search-box {

            position: relative;

            width: 100%;

            max-width: 430px;

        }


        .search-box i {

            position: absolute;

            left: 15px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #999;

        }


        .search-box input {

            width: 100%;

            border: 1px solid #ddd;

            background: white;

            border-radius: 30px;

            padding: 13px 18px 13px 43px;

            outline: none;

            transition: .3s;

        }


        .search-box input:focus {

            border-color: #b40000;

            box-shadow:
                0 5px 20px rgba(180,0,0,.08);

        }


        .product-count {

            color: #777;

            font-size: 13px;

        }


        /* =================================================
           HIDDEN UNTIL PART 2
        ================================================= */

        .product-grid {

            min-height: 200px;

        }


        /* =================================================
           RESPONSIVE
        ================================================= */

        @media(max-width:1000px) {

            .nav-links {

                gap: 15px;

            }


            .hero-content {

                width: 70%;

            }


            .feature-grid {

                grid-template-columns:
                    repeat(2,1fr);

            }

        }


        @media(max-width:700px) {

            .top-bar-left {

                display: none;

            }


            .top-bar-inner {

                justify-content: center;

            }


            .navbar {

                min-height: 68px;

            }


            .nav-links {

                position: fixed;

                top: 68px;

                left: -100%;

                width: 100%;

                background: white;

                flex-direction: column;

                padding: 30px;

                gap: 20px;

                box-shadow:
                    0 10px 25px rgba(0,0,0,.1);

                transition: .35s;

            }


            .nav-links.active {

                left: 0;

            }


            .menu-btn {

                display: flex;

            }


            .hero {

                min-height: 620px;

            }


            .hero-content {

                width: 100%;

            }


            .hero h1 {

                font-size: 45px;

            }


            .feature-grid {

                grid-template-columns: 1fr;

            }


            .shop-toolbar {

                flex-direction: column;

                align-items: stretch;

            }


            .search-box {

                max-width: none;

            }


            section {

                padding: 65px 0;

            }


            .section-title h2 {

                font-size: 29px;

            }

        }

<style>


/* =====================================================
   DRAWER OVERLAY
===================================================== */

.drawer-overlay {

    position: fixed;

    inset: 0;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(3px);

    z-index: 8000;

    opacity: 0;

    visibility: hidden;

    transition:
        opacity .35s ease,
        visibility .35s ease;

}


.drawer-overlay.active {

    opacity: 1;

    visibility: visible;

}



/* =====================================================
   SIDE DRAWER
===================================================== */

.side-drawer {

    position: fixed;

    top: 0;

    right: 0;

    width:
        min(440px, 94vw);

    height: 100vh;

    background: white;

    z-index: 8100;

    display: flex;

    flex-direction: column;

    transform:
        translateX(105%);

    transition:
        transform .45s cubic-bezier(.77,0,.18,1);

    box-shadow:
        -15px 0 45px rgba(0,0,0,.15);

}


.side-drawer.active {

    transform:
        translateX(0);

}



/* =====================================================
   DRAWER HEADER
===================================================== */

.drawer-header {

    padding:
        25px 22px;

    border-bottom:
        1px solid #eee;

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.drawer-small-title {

    color: #b40000;

    font-size: 9px;

    font-weight: 800;

    letter-spacing: 2px;

}


.drawer-header h2 {

    font-size: 22px;

    margin-top: 3px;

}


.drawer-close {

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    background: #f5f5f5;

    color: #333;

    transition: .3s;

}


.drawer-close:hover {

    background: #b40000;

    color: white;

    transform:
        rotate(90deg);

}



/* =====================================================
   DRAWER BODY
===================================================== */

.drawer-body {

    flex: 1;

    overflow-y: auto;

    padding: 20px;

}


.drawer-body::-webkit-scrollbar {

    width: 5px;

}


.drawer-body::-webkit-scrollbar-thumb {

    background: #ddd;

    border-radius: 10px;

}



/* =====================================================
   EMPTY STATE
===================================================== */

.empty-state {

    min-height:
        420px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

}


.empty-icon {

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: #fff4cc;

    color: #b40000;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 32px;

    margin-bottom: 20px;

    animation:
        emptyFloat 3s ease-in-out infinite;

}


.heart-empty {

    background: #ffeaea;

}


@keyframes emptyFloat {

    0%,
    100% {

        transform:
            translateY(0);

    }

    50% {

        transform:
            translateY(-8px);

    }

}


.empty-state h3 {

    font-size: 20px;

    margin-bottom: 7px;

}


.empty-state p {

    color: #888;

    font-size: 13px;

    margin-bottom: 22px;

}



/* =====================================================
   CART ITEM
===================================================== */

.cart-item {

    display: flex;

    gap: 12px;

    padding: 13px;

    border: 1px solid #eee;

    border-radius: 13px;

    margin-bottom: 12px;

    animation:
        cartItemIn .35s ease both;

}


@keyframes cartItemIn {

    from {

        opacity: 0;

        transform:
            translateX(30px);

====================================================== -->

<script>

function subscribeNewsletter(event) {

    event.preventDefault();

    const email =
        document.getElementById(
            "newsletterEmail"
        ).value.trim();


    if (!email) {

        return;

    }


    if (typeof showToast === "function") {

        showToast(
            "Thank you for subscribing!",
            "success"
        );

    }


    document.getElementById(
        "newsletterEmail"
    ).value = "";

}

</script>



<!-- =====================================================
     MOBILE MENU FUNCTIONS
====================================================== -->

<script>

function openMobileMenu() {

    const menu =
        document.getElementById(
            "mobileMenu"
        );

    const overlay =
        document.getElementById(
            "mobileMenuOverlay"
        );


    menu?.classList.add("active");

    overlay?.classList.add("active");

    document.body.classList.add(
        "drawer-open"
    );

}


function closeMobileMenu() {

    const menu =
        document.getElementById(
            "mobileMenu"
        );

    const overlay =
        document.getElementById(
            "mobileMenuOverlay"
        );


    menu?.classList.remove("active");

    overlay?.classList.remove("active");

}


function toggleFloatingMenu() {

    const menu =
        document.querySelector(
            ".floating-menu"
        );


    menu?.classList.toggle("active");

}

</script>



<!-- =====================================================
     CURRENT YEAR
====================================================== -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    function() {

        const year =
            document.getElementById(
                "currentYear"
            );


        if (year) {

            year.textContent =
                new Date().getFullYear();

        }

    }
);

</script>
