<!DOCTYPE html>
<html lang="hi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vishwash Grocery Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
        .toast-slide { animation: slideIn 0.3s ease-out forwards; }
        @keyframes slideIn {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .hover-anim:hover { transform: scale(1.03); filter: brightness(1.05); transition: all 0.2s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex flex-col justify-between pb-24 sm:pb-10">

    <div id="toast-container" class="fixed bottom-24 right-4 z-[120] flex flex-col gap-2 pointer-events-none"></div>

    <header class="sticky top-0 z-40 bg-white shadow-xs border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="#" onclick="switchTab('shop')" class="text-base sm:text-lg font-extrabold text-emerald-600 flex items-center gap-1.5">
                <span class="bg-emerald-600 text-white w-7 h-7 rounded-xl flex items-center justify-center text-sm shadow">
                    <i class="fa-solid fa-basket-shopping"></i>
                </span>
                Vishwash<span class="text-slate-900">Grocery</span>
            </a>
            <div class="flex items-center gap-2.5">
                <button onclick="switchTab('wishlist')" class="relative text-slate-600 p-1">
                    <i class="fa-regular fa-heart text-base"></i>
                    <span id="wishlist-badge" class="absolute -top-1 -right-1.5 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="switchTab('orders')" class="relative text-slate-600 p-1">
                    <i class="fa-solid fa-box text-base"></i>
                    <span id="orders-badge" class="absolute -top-1 -right-1.5 bg-slate-800 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="openSellerModal()" class="text-[11px] font-bold bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full">
                    <i class="fa-solid fa-store mr-1"></i>Seller
                </button>
                <button onclick="toggleCart()" class="relative bg-emerald-600 text-white w-8 h-8 rounded-full flex items-center justify-center shadow">
                    <i class="fa-solid fa-cart-shopping text-xs"></i>
                    <span id="cart-badge" class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>

        <div class="bg-slate-50 px-4 py-2 border-t border-slate-100 flex flex-col gap-2">
            <div class="max-w-3xl mx-auto w-full relative bg-white border border-slate-300 rounded-2xl flex items-center px-3.5 py-2 shadow-xs">
                <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs mr-2"></i>
                <input type="text" id="search-input" placeholder="Dal, Atta, Tel, Maggi khojein..." class="w-full bg-transparent text-xs text-slate-800 focus:outline-none">
            </div>
            <!-- Category Chips -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-1 max-w-3xl mx-auto w-full">
                <button onclick="filterCategory('All')" id="cat-btn-All" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-emerald-600 text-white">All (50)</button>
                <button onclick="filterCategory('Staples')" id="cat-btn-Staples" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700">Staples</button>
                <button onclick="filterCategory('Dairy')" id="cat-btn-Dairy" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700">Dairy & Bakery</button>
                <button onclick="filterCategory('Snacks')" id="cat-btn-Snacks" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700">Snacks & Biscuits</button>
                <button onclick="filterCategory('Beverages')" id="cat-btn-Beverages" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700">Beverages</button>
                <button onclick="filterCategory('Household')" id="cat-btn-Household" class="cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700">Household</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 py-4 flex-1 w-full">
        <section id="view-shop">
            <div class="flex justify-between items-center mb-3 px-1">
                <h2 id="product-count" class="text-xs font-bold text-slate-600">50 products found</h2>
            </div>
            <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-2.5 sm:gap-4"></div>
        </section>

        <section id="view-wishlist" class="hidden">
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <button onclick="switchTab('shop')" class="px-3 py-1.5 rounded-xl bg-slate-200 text-slate-800 text-xs font-bold">Back</button>
                <h2 class="text-sm font-bold">Wishlist</h2>
            </div>
            <div id="wishlist-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
        </section>

        <section id="view-orders" class="hidden">
            <div class="flex items-center justify-between mb-4 pb-2 border-b">
                <button onclick="switchTab('shop')" class="px-3 py-1.5 rounded-xl bg-slate-200 text-slate-800 text-xs font-bold">Back</button>
                <h2 class="text-sm font-bold">My Orders</h2>
            </div>
            <div id="orders-list" class="space-y-2.5 max-w-2xl mx-auto text-xs"></div>
        </section>
    </main>

    <!-- BOTTOM NAV MOBILE -->
    <nav class="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 grid grid-cols-5 text-center py-2 text-[10px] font-bold text-slate-600 shadow-2xl">
        <button onclick="switchTab('wishlist')" class="flex flex-col items-center justify-center"><i class="fa-solid fa-heart text-sm"></i><span>Wishlist</span></button>
        <button onclick="toggleCart()" class="flex flex-col items-center justify-center"><i class="fa-solid fa-bag-shopping text-sm"></i><span>Cart</span></button>
        <button onclick="switchTab('shop')" class="flex flex-col items-center justify-center text-emerald-600">
            <div class="bg-emerald-600 text-white w-9 h-9 rounded-full flex items-center justify-center -mt-3.5 shadow-md border-2 border-white"><i class="fa-solid fa-house text-xs"></i></div>
            <span class="mt-0.5">Shop</span>
        </button>
        <button onclick="switchTab('orders')" class="flex flex-col items-center justify-center"><i class="fa-solid fa-box text-sm"></i><span>Orders</span></button>
        <button onclick="openSellerModal()" class="flex flex-col items-center justify-center"><i class="fa-solid fa-store text-sm"></i><span>Seller</span></button>
    </nav>

    <!-- CART DRAWER -->
    <div id="cart-drawer" class="fixed inset-0 z-50 invisible transition-all duration-300">
        <div id="cart-backdrop" onclick="toggleCart()" class="fixed inset-0 bg-slate-900/60 opacity-0 transition-opacity duration-300"></div>
        <div id="cart-panel" class="fixed inset-y-0 right-0 max-w-full flex pl-10 transform translate-x-full transition-transform duration-300">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="px-5 py-3.5 border-b flex justify-between items-center text-sm font-bold">
                    <span>Aapka Cart</span>
                    <button onclick="toggleCart()"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cart-items-container" class="flex-1 overflow-y-auto p-4 space-y-2.5 divide-y text-xs"></div>
                <div class="border-t p-4 bg-slate-50 space-y-3">
                    <div class="flex justify-between font-extrabold text-sm"><span>Total (10% OFF Applied)</span><span id="cart-grand-total">₹0</span></div>
                    <button onclick="openCheckoutModal()" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow flex items-center justify-center gap-2 text-xs">
                        <i class="fa-brands fa-whatsapp text-base"></i> WhatsApp Par Order Karein
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- CHECKOUT MODAL (DETAILS FILL FORM) -->
    <div id="checkout-modal" class="fixed inset-0 z-50 invisible flex items-center justify-center p-4 bg-slate-900/60">
        <div class="relative bg-white w-full max-w-md rounded-3xl shadow-2xl p-5 space-y-3 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-sm text-slate-800">Delivery Details (COD)</h3>
                <button onclick="closeCheckoutModal()"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <form onsubmit="verifyPincodeAndBuy(event)" class="space-y-2.5">
                <input type="text" id="cust-name" required placeholder="Poora Naam *" class="w-full bg-slate-50 border p-2.5 rounded-xl">
                <input type="tel" id="cust-phone" required pattern="[0-9]{10}" placeholder="10 Digit Mobile Number *" class="w-full bg-slate-50 border p-2.5 rounded-xl">
                <input type="text" id="cust-pincode" required pattern="[0-9]{6}" maxlength="6" placeholder="6-digit Pincode (e.g. 394210) *" class="w-full bg-slate-50 border p-2.5 rounded-xl font-bold tracking-widest text-emerald-700">
                <textarea id="cust-address" rows="2" required placeholder="Poora Pata (Flat/House No., Area, City) *" class="w-full bg-slate-50 border p-2.5 rounded-xl"></textarea>
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-2xl shadow hover:bg-emerald-700">Confirm & WhatsApp Order</button>
            </form>
        </div>
    </div>

    <!-- SELLER MODAL -->
    <div id="seller-modal" class="fixed inset-0 z-50 invisible flex items-center justify-center p-4 bg-slate-900/60">
        <div class="relative bg-white w-full max-w-md rounded-3xl shadow-2xl p-5 space-y-3 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-extrabold text-sm">Add Grocery Item</h3>
                <button onclick="closeSellerModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form onsubmit="handleSellerAddProduct(event)" class="space-y-2.5">
                <input type="text" id="sp-name" required placeholder="Product Title (e.g. Besan 1kg)" class="w-full bg-slate-50 border p-2.5 rounded-xl">
                <select id="sp-category" class="w-full bg-slate-50 border p-2.5 rounded-xl">
                    <option value="Staples">Staples</option>
                    <option value="Dairy">Dairy & Bakery</option>
                    <option value="Snacks">Snacks & Biscuits</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Household">Household</option>
                </select>
                <input type="number" id="sp-price" required placeholder="Original Price (₹)" class="w-full bg-slate-50 border p-2.5 rounded-xl">
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-xl">Live Product (10% OFF)</button>
            </form>
        </div>
    </div>

    <script>
        const ADMIN_PHONE = '918460183525';
        
        const rawGroceryData = [
            { name: 'Aashirvaad Shudh Chakki Atta (5kg)', category: 'Staples', price: 240 },
            { name: 'Fortune Sunlite Sunflower Oil (1L)', category: 'Staples', price: 130 },
            { name: 'Tata Iodized Salt (1kg)', category: 'Staples', price: 28 },
            { name: 'Daawat Rozana Basmati Rice (5kg)', category: 'Staples', price: 350 },
            { name: 'Toor Dal / Arhar Dal (1kg)', category: 'Staples', price: 140 },
            { name: 'Moong Dal Split (1kg)', category: 'Staples', price: 120 },
            { name: 'Chana Dal (1kg)', category: 'Staples', price: 90 },
            { name: 'Sugar / Cheeni (1kg)', category: 'Staples', price: 45 },
            { name: 'Saffola Gold Blended Oil (1L)', category: 'Staples', price: 175 },
            { name: 'Dhara Desi Ghee (1L)', category: 'Dairy', price: 620 },
            { name: 'Amul Butter (500g)', category: 'Dairy', price: 280 },
            { name: 'Amul Taaza Homogenised Milk (1L)', category: 'Dairy', price: 68 },
            { name: 'Amul Cheese Slices (200g)', category: 'Dairy', price: 135 },
            { name: 'Amul Malai Paneer (200g)', category: 'Dairy', price: 95 },
            { name: 'Britannia 100% Whole Wheat Bread (400g)', category: 'Dairy', price: 50 },
            { name: 'Maggi 2-Minute Noodles (8-Pack)', category: 'Snacks', price: 112 },
            { name: 'Lay\'s India\'s Magic Masala (Large)', category: 'Snacks', price: 40 },
            { name: 'Kurkure Masala Munch (Large)', category: 'Snacks', price: 40 },
            { name: 'Haldiram\'s Nagpur Bhujia Sev (400g)', category: 'Snacks', price: 110 },
            { name: 'Britannia Good Day Cashew Cookies (600g)', category: 'Snacks', price: 110 },
            { name: 'Parle-G Gold Biscuits (1kg)', category: 'Snacks', price: 95 },
            { name: 'Bru Gold Instant Coffee (50g)', category: 'Beverages', price: 160 },
            { name: 'Nescafe Classic Instant Coffee (50g)', category: 'Beverages', price: 150 },
            { name: 'Red Label Natural Care Tea (500g)', category: 'Beverages', price: 310 },
            { name: 'Taj Mahal Rich Tea Leaves (250g)', category: 'Beverages', price: 230 },
            { name: 'Bournvita Health Drink Refill (500g)', category: 'Beverages', price: 245 },
            { name: 'Horlicks Classic Malt (500g)', category: 'Beverages', price: 260 },
            { name: 'Tropicana 100% Orange Juice (1L)', category: 'Beverages', price: 140 },
            { name: 'Real Activ Mixed Fruit Juice (1L)', category: 'Beverages', price: 135 },
            { name: 'Surf Excel Matic Front Load Detergent (2kg)', category: 'Household', price: 450 },
            { name: 'Surf Excel Detergent Powder (3kg)', category: 'Household', price: 380 },
            { name: 'Vim Dishwash Gel Bottle (750ml)', category: 'Household', price: 199 },
            { name: 'Lizol Floor Cleaner Citrus (2L)', category: 'Household', price: 399 },
            { name: 'Lizol Disinfectant Spray (500ml)', category: 'Household', price: 299 },
            { name: 'Rin Detergent Bar (4-Pack)', category: 'Household', price: 55 },
            { name: 'Harpic Powerplus Toilet Cleaner (1L)', category: 'Household', price: 185 },
            { name: 'Goodknight Gold Flash Liquid Refill', category: 'Household', price: 225 },
            { name: 'Dettol Antiseptic Liquid (500ml)', category: 'Household', price: 320 },
            { name: 'Everest Garam Masala Powder (100g)', category: 'Staples', price: 78 },
            { name: 'MDH Kitchen King Masala (100g)', category: 'Staples', price: 75 },
            { name: 'Catch Kashmiri Lal Mirch Powder (200g)', category: 'Staples', price: 140 },
            { name: 'Everest Turmeric Powder (500g)', category: 'Staples', price: 195 },
            { name: 'Quaker White Oats (1kg)', category: 'Staples', price: 210 },
            { name: 'Kellogg\'s Corn Flakes Original (875g)', category: 'Staples', price: 340 },
            { name: 'Lifebuoy Total Soap (4-Pack)', category: 'Household', price: 140 },
            { name: 'Dove Cream Beauty Bathing Bar (3-Pack)', category: 'Household', price: 210 },
            { name: 'Colgate Strong Teeth Toothpaste (500g Pack)', category: 'Household', price: 230 },
            { name: 'Pantene Hair Fall Control Shampoo (650ml)', category: 'Household', price: 499 },
            { name: 'Parachute Advansed Coconut Oil (500ml)', category: 'Household', price: 220 },
            { name: 'Odomos Mosquito Repellent Cream (100g)', category: 'Household', price: 105 }
        ];

        const groceryPhotos = [
            '1542838132-92c53300491e', '1584473457409-f6c0d6a6957a', '1578916171728-46686eac8d58',
            '1563636619-e9143da7973b', '1534723452862-4c874018d66d', '1553530666-ba11a7da3888',
            '1608686207856-001b95cf60ca', '1586201375761-83865001e31c'
        ];

        let products = rawGroceryData.map((item, idx) => {
            const sig = groceryPhotos[idx % groceryPhotos.length];
            return {
                id: idx + 1,
                name: item.name,
                category: item.category,
                originalPrice: item.price,
                price: Math.round(item.price * 0.9), // 10% OFF
                image: `https://images.unsplash.com/photo-${sig}?w=400&auto=format&fit=crop&q=80`
            };
        });

        let cart = [];
        let wishlist = [];
        let orders = JSON.parse(localStorage.getItem('vishwash_grocery_orders')) || [];
        let searchQuery = '';
        let selectedCategory = 'All';

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts();
            updateCartUI();
            updateWishlistUI();
            updateOrdersUI();
            setupSearch();
        });

        function showToast(msg) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-slide bg-slate-900 text-white text-[11px] font-semibold px-3.5 py-2.5 rounded-2xl shadow-xl flex items-center gap-2 border border-slate-700`;
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2200);
        }

        function switchTab(tabName) {
            ['shop', 'wishlist', 'orders'].forEach(t => {
                const el = document.getElementById(`view-${t}`);
                if(el) el.classList.add('hidden');
            });
            const target = document.getElementById(`view-${tabName}`);
            if(target) target.classList.remove('hidden');
            if(tabName === 'wishlist') renderWishlist();
            if(tabName === 'orders') updateOrdersUI();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setupSearch() {
            const input = document.getElementById('search-input');
            if(input) {
                input.addEventListener('input', (e) => {
                    searchQuery = e.target.value.toLowerCase().trim();
                    renderProducts();
                });
            }
        }

        function filterCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-chip').forEach(btn => {
                btn.className = 'cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-white border border-slate-200 text-slate-700';
            });
            const activeBtn = document.getElementById(`cat-btn-${cat}`);
            if(activeBtn) {
                activeBtn.className = 'cat-chip whitespace-nowrap px-3 py-1.5 rounded-xl text-[11px] font-bold bg-emerald-600 text-white shadow-xs';
            }
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const countEl = document.getElementById('product-count');
            if(!grid) return;

            const filtered = products.filter(p => {
                const matchesCat = selectedCategory === 'All' || p.category === selectedCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchQuery) || p.category.toLowerCase().includes(searchQuery);
                return matchesCat && matchesSearch;
            });
            if(countEl) countEl.innerText = `${filtered.length} products found`;

            grid.innerHTML = filtered.map(p => {
                const isWished = wishlist.includes(p.id);
                return `
                    <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs hover:shadow-md transition overflow-hidden flex flex-col justify-between p-2.5 gap-2">
                        <div class="relative overflow-hidden aspect-square bg-slate-50 rounded-xl">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover rounded-xl">
                            <span class="absolute top-1 left-1 bg-emerald-600 text-white text-[9px] font-extrabold px-1.5 py-0.5 rounded shadow">10% OFF</span>
                            <button onclick="toggleWishlist(${p.id})" class="absolute top-1 right-1 w-6 h-6 rounded-full bg-white/95 flex items-center justify-center text-[10px] shadow ${isWished ? 'text-red-500 bg-red-50' : 'text-slate-400'}">
                                <i class="fa-${isWished ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                        </div>
                        <div class="flex-1 flex flex-col justify-between">
                            <div>
                                <span class="text-[9px] font-bold text-emerald-600 uppercase">${p.category}</span>
                                <h3 class="font-bold text-slate-800 text-[11px] line-clamp-2 leading-tight mb-1">${p.name}</h3>
                            </div>
                            <div class="flex items-center gap-1.5 mt-1">
                                <span class="text-xs font-extrabold text-slate-900">₹${p.price}</span>
                                <span class="text-[9px] text-slate-400 line-through">₹${p.originalPrice}</span>
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-1.5 pt-1">
                            <button onclick="addToCart(${p.id})" class="bg-slate-100 hover:bg-slate-200 text-slate-800 font-bold py-1.5 rounded-xl text-[10px] transition">Add Cart</button>
                            <button onclick="buyNowDirect(${p.id})" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1.5 rounded-xl text-[10px] transition shadow-xs">BUY NOW</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function toggleWishlist(id) {
            const idx = wishlist.indexOf(id);
            if(idx > -1) { wishlist.splice(idx, 1); showToast("Wishlist se हटाया गया"); }
            else { wishlist.push(id); showToast("Wishlist me जोड़ा गया!"); }
            updateWishlistUI();
            renderProducts();
        }

        function updateWishlistUI() {
            const badge = document.getElementById('wishlist-badge');
            if(badge) badge.innerText = wishlist.length;
        }

        function renderWishlist() {
            const grid = document.getElementById('wishlist-grid');
            if(!grid) return;
            const wishedProds = products.filter(p => wishlist.includes(p.id));
            if(wishedProds.length === 0) { 
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400 text-xs">Aapki wishlist khaali hai.</div>`; 
                return; 
            }
            grid.innerHTML = wishedProds.map(p => `
                <div class="bg-white rounded-2xl border p-2 text-xs flex flex-col justify-between">
                    <div>
                        <img src="${p.image}" class="w-full aspect-square object-cover rounded-xl mb-1.5">
                        <h4 class="font-bold text-[11px] line-clamp-1">${p.name}</h4>
                        <p class="font-extrabold text-xs mt-1">₹${p.price}</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="w-full bg-emerald-600 text-white font-bold py-1.5 rounded-xl text-[10px] mt-2">Move to Cart</button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const prod = products.find(p => p.id === id);
            if(!prod) return;
            const found = cart.find(c => c.id === id);
            if(found) found.qty += 1;
            else cart.push({ ...prod, qty: 1 });
            updateCartUI();
            showToast("Cart me joda gaya!");
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((acc, item) => acc + item.qty, 0);
            if(badge) badge.innerText = totalCount;

            const container = document.getElementById('cart-items-container');
            const grandTotalEl = document.getElementById('cart-grand-total');
            if(!container) return;

            if(cart.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">Cart khaali hai.</div>`;
                if(grandTotalEl) grandTotalEl.innerText = '₹0';
                return;
            }
            let grandTotal = 0;
            container.innerHTML = cart.map(item => {
                const sub = item.price * item.qty;
                grandTotal += sub;
                return `
                    <div class="py-2 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-2">
                            <img src="${item.image}" class="w-9 h-9 rounded-lg object-cover">
                            <div>
                                <h4 class="font-bold text-[11px] text-slate-800 line-clamp-1">${item.name}</h4>
                                <p class="text-[10px] font-extrabold text-emerald-600">₹${item.price} x ${item.qty}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 rounded bg-slate-100 font-bold">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.qty}</span>
                            <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 rounded bg-slate-100 font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');
            if(grandTotalEl) grandTotalEl.innerText = `₹${grandTotal}`;
        }

        function changeQty(id, delta) {
            const found = cart.find(c => c.id === id);
            if(!found) return;
            found.qty += delta;
            if(found.qty <= 0) cart = cart.filter(c => c.id !== id);
            updateCartUI();
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            const panel = document.getElementById('cart-panel');
            const backdrop = document.getElementById('cart-backdrop');
            if(!drawer || !panel || !backdrop) return;

            if(drawer.classList.contains('invisible')) {
                drawer.classList.remove('invisible');
                setTimeout(() => { backdrop.style.opacity = '1'; panel.classList.remove('translate-x-full'); }, 10);
            } else {
                backdrop.style.opacity = '0'; 
                panel.classList.add('translate-x-full');
                setTimeout(() => drawer.classList.add('invisible'), 300);
            }
        }

        function buyNowDirect(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            cart = [{ ...p, qty: 1 }];
            updateCartUI();
            openCheckoutModal();
        }

        function openCheckoutModal() {
            if(cart.length === 0) { showToast("Cart khaali hai!"); return; }
            const drawer = document.getElementById('cart-drawer');
            if(drawer && !drawer.classList.contains('invisible')) toggleCart();
            const modal = document.getElementById('checkout-modal');
            if(modal) modal.classList.remove('invisible');
        }

        function closeCheckoutModal() { 
            const modal = document.getElementById('checkout-modal');
            if(modal) modal.classList.add('invisible'); 
        }

        function verifyPincodeAndBuy(e) {
            e.preventDefault();
            const nameEl = document.getElementById('cust-name');
            const phoneEl = document.getElementById('cust-phone');
            const pincodeEl = document.getElementById('cust-pincode');
            const addressEl = document.getElementById('cust-address');
            if(!nameEl || !phoneEl || !pincodeEl || !addressEl) return;

            const name = nameEl.value;
            const phone = phoneEl.value;
            const pincode = pincodeEl.value;
            const address = addressEl.value;
            if(!/^[0-9]{6}$/.test(pincode)) { showToast("Sahi 6-digit Pincode dalein!"); return; }

            const grandTotal = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);
            const orderObj = {
                id: 'VG-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toLocaleDateString('hi-IN'),
                name, phone, pincode, address,
                items: [...cart], total: grandTotal
            };

            orders.unshift(orderObj);
            localStorage.setItem('vishwash_grocery_orders', JSON.stringify(orders));
            cart = [];
            updateCartUI();
            updateOrdersUI();
            closeCheckoutModal();

            let msg = `*New Grocery Order - Vishwash*\nOrder ID: ${orderObj.id}\nNaam: ${name}\nPhone: ${phone}\nPincode: ${pincode}\nAddress: ${address}\n\n*Items (10% OFF Applied):*\n`;
            orderObj.items.forEach(i => { msg += `- ${i.name} x ${i.qty} = ₹${i.price * i.qty}\n`; });
            msg += `\n*Total Payable: ₹${grandTotal} (Cash on Delivery)*`;
            window.open(`https://wa.me/${ADMIN_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
            showToast('Order WhatsApp par bheja gaya!');
        }

        function updateOrdersUI() {
            const badge = document.getElementById('orders-badge');
            if(badge) badge.innerText = orders.length;
            const list = document.getElementById('orders-list');
            if(!list) return;
            if(orders.length === 0) { 
                list.innerHTML = `<div class="text-center py-10 text-slate-400 text-xs">Abhi tak koi order nahi hai.</div>`; 
                return; 
            }
            list.innerHTML = orders.map(o => `
                <div class="bg-white border rounded-2xl p-3 shadow-xs flex justify-between">
                    <div>
                        <div class="font-extrabold text-slate-900">${o.id} - ${o.name}</div>
                        <p class="text-slate-500 text-[10px]">${o.date} | Pincode: ${o.pincode}</p>
                    </div>
                    <div class="text-right font-extrabold">₹${o.total}</div>
                </div>
            `).join('');
        }

        function openSellerModal() { 
            const modal = document.getElementById('seller-modal');
            if(modal) modal.classList.remove('invisible'); 
        }

        function closeSellerModal() { 
            const modal = document.getElementById('seller-modal');
            if(modal) modal.classList.add('invisible'); 
        }

        function handleSellerAddProduct(e) {
            e.preventDefault();
            const pTitleEl = document.getElementById('sp-name');
            const pCatEl = document.getElementById('sp-category');
            const origPriceEl = document.getElementById('sp-price');
            if(!pTitleEl || !origPriceEl) return;

            const pTitle = pTitleEl.value;
            const pCat = pCatEl ? pCatEl.value : 'Staples';
            const origPrice = Number(origPriceEl.value);

            products.unshift({
                id: products.length + 1,
                name: pTitle,
                category: pCat,
                originalPrice: origPrice,
                price: Math.round(origPrice * 0.9),
                image: 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400&auto=format&fit=crop&q=80'
            });
            closeSellerModal();
            renderProducts();
            showToast('New grocery item added (10% OFF)!');
        }
    </script>
</body>
</html>
